<style>
:root{--bg:#eceef1;--p:#fff;--l:#d5d9df;--t:#171b22;--m:#66707e;--a:#2457e6;--r:#d23b32;--e:#aab1bc;--dot:#c9ced6;

:root[data-theme=dark]{--bg:#0c0f17;--p:#101524;--l:rgba(255,255,255,.09);--t:#ffffff;--m:#94a3b8;--a:#38bdf8;--r:#ef4444;--e:rgba(148,163,184,.38);--dot:rgba(255,255,255,.14);
--c0:#38bdf8;--c1:#c084fc;--c2:#34d399;--c3:#fbbf24;--c4:#94a3b8;--c5:#facc15}
:root[data-style=violet][data-theme=dark]{--bg:#0c0f17;--p:#111625;--l:rgba(255,255,255,.09);--t:#ffffff;--m:#94a3b8;--a:#38bdf8;--e:rgba(148,163,184,.38);--dot:rgba(255,255,255,.14);--c0:#38bdf8;--c1:#c084fc;--c2:#34d399;--c3:#fbbf24;--c4:#94a3b8;--c5:#facc15}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:400 13px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#bar{position:fixed;inset:0 0 auto 0;z-index:5;height:var(--bh);padding:env(safe-area-inset-top,0px) 10px 0;display:flex;gap:6px;align-items:center;background:var(--p);border-bottom:1px solid var(--l);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.br{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;margin-right:6px}
.br i{width:14px;height:14px;border:2px solid var(--a);border-radius:50%;position:relative}
.br i:after{content:"";position:absolute;left:9px;top:-6px;width:5px;height:5px;background:var(--a);border-radius:50%}
#q{height:30px;width:170px;flex:none;border:1px solid var(--l);border-radius:6px;background:var(--bg);padding:0 10px;outline:0}
#q:focus,.ins input:focus,.ins select:focus,.ins textarea:focus{border-color:var(--a)}
.b{height:30px;flex:none;padding:0 11px;border:1px solid var(--l);border-radius:6px;background:var(--p);cursor:pointer}
.b:hover{background:var(--bg)}.b.on{border-color:var(--a);color:var(--a);font-weight:500}.b:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.sp{flex:1}
#vp{position:fixed;inset:var(--bh) 0 0 0;touch-action:none;overflow:hidden;cursor:grab;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:28px 28px}
#vp.pan{cursor:grabbing}
#w{position:absolute;left:0;top:0;transform-origin:0 0}
#es{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#es path{fill:none;stroke:var(--e);stroke-width:1.3}#es path.on{stroke:var(--a);stroke-width:1.9}
.n{position:absolute;left:0;top:0;min-width:168px;max-width:240px;padding:9px 12px 10px;background:var(--p);border:1px solid var(--l);border-left:3px solid var(--c);border-radius:6px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.n small{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--c);font-weight:500}
.n small em{font-style:normal;font-weight:600}
.n b{display:block;font-weight:600;font-size:13.5px;margin-top:2px;overflow-wrap:break-word}
.n i{display:block;font-style:normal;color:var(--m);font-size:12px;overflow-wrap:break-word}
.n.sel{box-shadow:0 0 0 2px var(--a);border-color:var(--a);border-left-color:var(--c)}
.n.src{box-shadow:0 0 0 2px var(--a);border-style:dashed}.n.hit{box-shadow:0 0 0 2px var(--c1)}.n.dim{opacity:.2}
.ins{position:fixed;z-index:6;top:var(--bh);right:0;bottom:0;width:300px;background:var(--p);border-left:1px solid var(--l);padding:14px;overflow:auto;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;gap:10px}
.ins.open{transform:none}
.ins label{display:flex;flex-direction:column;gap:4px;color:var(--m);font-size:12px}
.ins input,.ins select,.ins textarea{width:100%;border:1px solid var(--l);border-radius:6px;background:var(--bg);padding:6px 8px;color:var(--t);outline:0;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{display:grid;grid-template-columns:1fr 1.4fr 30px;gap:6px}.kv .b{padding:0}
.fl{color:var(--m);font-size:12px;margin-top:2px}.row{display:flex;gap:6px;margin-top:auto}.del{color:var(--r)}
#mm{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:132px;height:88px;background:var(--p);border:1px solid var(--l);border-radius:6px;cursor:pointer}
#st{position:fixed;left:156px;bottom:calc(14px + env(safe-area-inset-bottom,0px));color:var(--m);font-size:12px;font-variant-numeric:tabular-nums}
#ts{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:7px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#ts.on{opacity:1}
#bg,#vl,#sn{position:fixed;inset:0;pointer-events:none}
#bg{background:center/cover no-repeat;will-change:transform;transition:opacity .35s}#vl{background:var(--bg)}
.n{contain:layout style}
.set{right:auto;left:0;border-left:0;border-right:1px solid var(--l);transform:translateX(-100%)}.set.open{transform:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tl{background-size:cover}
.tl{height:56px;border:1px solid var(--l);border-radius:6px;background:var(--bg) center/cover;color:var(--t);font-size:12px;cursor:pointer}.tl.on{outline:2px solid var(--a);outline-offset:1px}
.ck{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--t)!important}.ck input{width:auto}
.eco *{transition:none!important}

:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-style=violet]{--bg:#eeeaf8;--p:#fff;--l:#d9d2ee;--t:#1c1533;--m:#6e6590;--a:#6d3df0;--e:#b4a8da;--dot:#d3c9ee;--c0:#6d3df0;--c1:#c9821a;--c2:#12998a;--c3:#b4309f;--c4:#7d7599;--c5:#a8892a}
:root[data-style=violet][data-theme=dark]{--bg:#0e0a1c;--p:#171230;--l:#2a2250;--t:#ece8fb;--m:#9a90c2;--a:#a47bff;--e:#4a3f7d;--dot:#241c45;--c0:#a47bff;--c1:#f0b35c;--c2:#4fd1b9;--c3:#e070d0;--c4:#9a90c2;--c5:#e3cf6a}
.ins{scrollbar-width:thin;scrollbar-color:var(--l) transparent}input[type=range],input[type=checkbox]{accent-color:var(--a)}
.tl{display:flex;align-items:flex-end;padding:0 5px 4px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;text-align:left}.tl[data-bg=none]{color:var(--t);text-shadow:none;align-items:center;justify-content:center}
.so #vp{left:300px}.so #mm{left:312px}.so #st{left:456px}
.n.sel{z-index:2}.n:not(.sel):hover{border-color:var(--e)}#es path.dim{opacity:.15}.lk #vp{cursor:crosshair}
.m .b,.m #q{height:38px}.m .b{padding:0 14px}.m #mm,.m #st{display:none}
#bg2{position:fixed;inset:0;pointer-events:none;background:center/contain no-repeat;transition:opacity .35s}
.ins>*{flex-shrink:0}#dock .b{font-size:11px}
.seg{display:flex;border:1px solid var(--l);border-radius:8px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;-webkit-overflow-scrolling:touch;touch-action:pan-x;background:var(--bg);padding:2px;gap:2px}
.seg::-webkit-scrollbar{height:4px}
.seg::-webkit-scrollbar-track{background:transparent}
.seg::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:4px}
.seg::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.55)}
.seg button{flex:0 0 auto;min-width:64px;height:30px;padding:0 13px;border:0;border-radius:6px;background:transparent;cursor:pointer;white-space:nowrap;font-size:11.5px;font-weight:500;color:var(--t);transition:background .15s ease,color .15s ease}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button.on{background:var(--a);color:#ffffff;font-weight:600;box-shadow:0 2px 8px rgba(56,189,248,.35)}
.ph{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;z-index:1;background:var(--p);padding:2px 0 8px;font-weight:600;font-size:14px}.ph .b{width:32px;padding:0}
#dock{position:fixed;inset:auto 0 0 0;z-index:7;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--p);border-top:1px solid var(--l)}
#dock .b{flex:1;min-width:0;padding:0 2px;height:42px;font-size:12px}
#more{position:fixed;right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:8;display:none;flex-direction:column;gap:4px;padding:8px;background:var(--p);border:1px solid var(--l);border-radius:8px;min-width:180px}#more.open{display:flex}#more .b{width:100%;text-align:left;height:42px}
.m #vp{bottom:calc(58px + env(safe-area-inset-bottom,0px))}.m .ins{bottom:calc(58px + env(safe-area-inset-bottom,0px));max-height:46vh}.m #q{flex:1;min-width:0;width:auto}
@media(max-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}.tl{height:50px;font-size:10px}}
@media(max-width:640px){.ins{inset:auto 0 0 0;width:auto;max-height:64vh;border-left:0;border-top:1px solid var(--l);transform:translateY(100%)}#mm,#st{display:none}#q{width:120px}.set{border-right:0}}
@media(prefers-reduced-motion:reduce){.ins,#ts{transition:none}}

.brand-logo-img{width:22px;height:22px;border-radius:6px;object-fit:cover;flex-shrink:0;box-shadow:0 0 10px rgba(56,189,248,.35)}
.n{border-left:3.5px solid var(--c)!important;border-radius:8px!important;box-shadow:0 4px 18px rgba(0,0,0,.55)!important}
.n small{text-transform:uppercase!important;font-weight:600!important;letter-spacing:.3px!important}
.n b{font-weight:700!important;font-size:13.5px!important}
.n i{font-size:11px!important;color:var(--m)!important}
#es path{stroke-width:1.8px!important;stroke:var(--e)}
#es path.on{stroke:var(--a)!important;stroke-width:2.4px!important}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--p);border:1px solid var(--l);border-radius:12px;width:min(94vw,980px);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.85);overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--l);font-weight:600;font-size:14px}
.snap-img-wrap{flex:1;min-height:220px;max-height:64vh;overflow:auto;display:flex;align-items:center;justify-content:center;background:#080a10;padding:14px}
.snap-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.7)}
.snap-actions{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--l);flex-wrap:wrap;background:var(--p)}
.snap-tip{padding:0 18px 12px;font-size:11.5px;color:var(--m)}
body.zen #bar,body.zen #ins,body.zen #set,body.zen #mm,body.zen #st,body.zen #dock,body.zen #more{display:none!important}
#zen-exit{position:fixed;top:14px;right:14px;z-index:100;display:none;background:rgba(16,21,36,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.6);user-select:none}
body.zen #zen-exit{display:flex;align-items:center;gap:6px}
#zen-exit:hover{background:rgba(30,41,66,.95)}


/* Trails and Illumination System */
#es{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
/* Standard Mode: clean, crisp, calm wire */
#es.mode-curve path.trail-base{stroke:var(--c,rgba(148,163,184,.38));stroke-width:var(--trail-w,1.8px);opacity:.75;filter:none!important}
#es.mode-curve path.trail-halo,#es.mode-curve path.trail-filament{display:none!important}

/* Neon Glow Mode: real glowing neon tube with halo and bright core */
#es path.trail-halo{fill:none;stroke:var(--c,var(--a));stroke-width:calc(var(--trail-w,1.8px) * 2.8 + 6px);stroke-linecap:round;opacity:.42;filter:blur(4px);pointer-events:none;transition:opacity .2s ease,stroke-width .2s ease}
#es path.trail-halo.active{stroke-width:calc(var(--trail-active-w,3.2px) * 3 + 8px)!important;opacity:.78!important;filter:blur(6px)!important;display:inline!important}
#es path.trail-halo.dim{opacity:.05!important}
#es.mode-glow path.trail-base{stroke:var(--c,var(--a))!important;stroke-width:var(--trail-w,1.8px)!important;opacity:1!important;filter:drop-shadow(0 0 5px var(--c,var(--a)))!important}
#es path.trail-filament{fill:none;stroke:#ffffff;stroke-width:1px;stroke-linecap:round;opacity:.65;pointer-events:none}
#es path.trail-filament.active{stroke-width:1.4px!important;opacity:.95!important;display:inline!important}
#es path.trail-filament.dim{opacity:0!important}

#es path.trail-base{fill:none;stroke:var(--e,rgba(148,163,184,.38));stroke-width:var(--trail-w,1.8px);stroke-linecap:round;transition:stroke .18s ease,stroke-width .18s ease,opacity .18s ease,filter .18s ease}
#es.mode-pulse path.trail-base{stroke:var(--e,rgba(148,163,184,.28));stroke-width:var(--trail-w,1.8px)}
#es path.trail-base.dim{opacity:.12!important;stroke-width:calc(var(--trail-w,1.8px) * .7)!important;filter:none!important}
#es path.trail-base.on{stroke:var(--c,var(--a))!important;stroke-width:var(--trail-active-w,3.2px)!important;opacity:1!important;filter:drop-shadow(0 0 6px var(--c,var(--a))) drop-shadow(0 0 16px var(--c,var(--a)))!important}
#es path.trail-pulse{fill:none;stroke:#ffffff;stroke-width:calc(var(--trail-w,1.8px) + .3px);stroke-linecap:round;stroke-dasharray:6 22;animation:trailPulse 1.6s linear infinite;opacity:.55;pointer-events:none}
#es path.trail-pulse.active{stroke:#ffffff!important;stroke-width:calc(var(--trail-active-w,3.2px) + .2px)!important;stroke-dasharray:8 18;animation:trailPulse 1.0s linear infinite;opacity:1!important;filter:drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 14px var(--c,var(--a)))}
@keyframes trailPulse{to{stroke-dashoffset:-28}}
.n.peer{border-color:var(--c)!important;box-shadow:0 0 0 1.5px var(--c),0 0 20px rgba(56,189,248,.38)!important;opacity:1!important;transform:scale(1.02);transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease}
.n.dim{opacity:.18!important;filter:grayscale(45%);transition:opacity .2s ease,filter .2s ease}


/* Hardware acceleration and zero-lag dragging */
#w{will-change:transform;backface-visibility:hidden;transform:translateZ(0)}
.n{will-change:transform;contain:layout style;backface-visibility:hidden}
#vp{will-change:background-position;contain:paint}
body.moving .n,body.moving #es path,body.moving #w{transition:none!important}
body.moving{user-select:none!important;-webkit-user-select:none!important}


body.no-anim .trail-pulse,#es.no-anim .trail-pulse{display:none!important}
body.no-anim *{animation-play-state:paused!important}

</style>

<script>
(()=>{

const TX={
ru:"Узел|Связь|Раскладка|Вписать|Поиск|Экспорт|Импорт|Досье|Сброс|Язык|Название|Описание|Тип|Риск|Заметки|Поля|Добавить поле|Дубль|Удалить|Скопировано|Сбросить граф?|нет|низкий|средний|высокий|Субъект|Контакт|Место|Организация|Документ|Заметка|Связь: выбери два узла|узлов|связей|Вид|Тема|Авто|Светлая|Тёмная|Фон|Без фона|Своё фото|Подложка|Размытие|Сетка|Снег|Частота кадров|Эко-режим|Фокус на связях|Стиль|Фиолет|Графит|Папка bg/ не найдена|Показ|Целиком|Во весь экран|Ещё".split("|"),
en:"Node|Link|Layout|Fit|Search|Export|Import|Dossier|Reset|Language|Title|Subtitle|Type|Risk|Notes|Fields|Add field|Duplicate|Delete|Copied|Reset graph?|none|low|medium|high|Subject|Contact|Place|Organization|Document|Note|Link: pick two nodes|nodes|links|View|Theme|Auto|Light|Dark|Background|None|Own image|Overlay|Blur|Grid|Snow|Frame rate|Eco mode|Focus on neighbours|Style|Violet|Graphite|Folder bg/ not found|Fit|Whole|Fill|More".split("|"),

let currentSnapDataUrl="";
const btnSnapCopy=document.getElementById("btn-snap-copy");
if(btnSnapCopy){
  btnSnapCopy.addEventListener("click",()=>{
    if(!currentSnapDataUrl)return;
    fetch(currentSnapDataUrl).then(r=>r.blob()).then(blob=>{
      navigator.clipboard.write([new ClipboardItem({"image/png":blob})])
        .then(()=>toast("Картинка скопирована в буфер (Ctrl+V)"))
        .catch(()=>toast("Правый клик по картинке -> Копировать"));
    });
  });
}
const btnSnapOpen=document.getElementById("btn-snap-open");
if(btnSnapOpen){
  btnSnapOpen.addEventListener("click",()=>{
    if(!currentSnapDataUrl)return;
    const w=window.open();
    if(w)w.document.write(`<title>Cosmos Snapshot</title><body style="margin:0;background:#0c0f17;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${currentSnapDataUrl}" style="max-width:98%;max-height:98%;object-fit:contain;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.8);"></body>`);
  });
}
const btnSnapDownload=document.getElementById("btn-snap-download");
if(btnSnapDownload){
  btnSnapDownload.addEventListener("click",()=>{
    if(!currentSnapDataUrl)return;
    const a=document.createElement("a");
    a.download=`Cosmos_Snapshot_${Date.now()}.png`;
    a.href=currentSnapDataUrl;
    a.click();
    toast("Файл сохранен");
  });
}
const btnSnapClose=document.getElementById("btn-snap-close");
if(btnSnapClose){
  btnSnapClose.addEventListener("click",()=>{
    const m=document.getElementById("snap-modal");
    if(m)m.classList.remove("open");
  });
}
const zenExit=document.getElementById("zen-exit");
if(zenExit){

}
